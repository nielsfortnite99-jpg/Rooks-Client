[package]
name = "rooks-client"
version = "0.1.0"
description = "Rook's Client Minecraft Launcher"
authors = ["Rook's Client"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rooks_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
